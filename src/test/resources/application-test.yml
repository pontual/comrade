spring:
  config:
    import: optional:classpath:secrets/local/secret-local.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: ${JWT_SECRET}
    cookie:
      secure: false
      same-site: "Lax"

dashboard:
  daily:
    limit-to-24h: false

server:
  port: 8081