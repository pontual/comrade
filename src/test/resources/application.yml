spring:
  application:
    name: pontual-monitor-api

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  main:
    banner-mode: console

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full

security:
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  paths-to-exclude: /actuator/**, /error

server:
  servlet:
    context-path: /pontual/api/v1

sgman:
  client:
    unit: ${UNIT}
    url: https://get.api.sismetro.com
  token:
    solicitantes: ${KEY_SOLICITANTES}
    patrimonio: ${KEY_PATRIMONIOS}

logging:
  level:
    feign: DEBUG
    org.springframework.security: INFO