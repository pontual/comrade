spring:
  config:
    import: optional:classpath:secrets/prod/secret-prod.properties

  application:
    name: pontual-monitor-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  main:
    banner-mode: console

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: info,health
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  info:
    defaults:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full

security:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: 900000 #15 minutes
    refresh-expiration-ms: 604800000 #7 dias
    remember-refresh-expiration-ms: 1296000000 #15 dias
    cookie:
      secure: true
      same-site: "None"

springdoc:
  paths-to-exclude: /error
  show-actuator: true
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /pontual/api/v1
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

sgman:
  client:
    unit: ${UNIT}
    url: https://get.api.sismetro.com
  token:
    solicitante: ${KEY_SOLICITANTES}
    patrimonio: ${KEY_PATRIMONIOS}

logging:
  level:
    feign: DEBUG
    org.springframework.security: INFO

info:
  app:
    name: Pontual Monitor API
    version: ${build.version}
    profile: ${spring.profiles.active:default}
